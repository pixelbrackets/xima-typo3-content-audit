<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:dashboard="http://typo3.org/ns/TYPO3/CMS/Dashboard/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true">

<f:if condition="{version} < 13">
    <div class="widget-content-title d-flex" style="gap:10px;">
        <core:icon identifier="content-audit-widgets-searches-without-results" size="small"/>
        <span><f:translate key="widgets.searches_without_results.title" extensionName="XimaTypo3ContentAudit"/></span>
    </div>
</f:if>
<div class="widget-content-main x--content-audit-widget--main" style="--mask: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0, rgba(0, 0, 0, 1) 90%, rgba(0, 0, 0, 0) 95%, rgba(0, 0, 0, 0) 0) 100% 90% / 100% 100% repeat-x;-webkit-mask: var(--mask);mask: var(--mask);">
    <f:if condition="!{searchExtensionIsInstalled}">
        <div class="row widget-no-items-found">
            <div class="col-xs-12">
                <p>
                    <f:translate key="widgets.searches_without_results.extension_required" extensionName="XimaTypo3ContentAudit"/>
                </p>
            </div>
        </div>
    </f:if>

    <f:if condition="{searchExtensionIsInstalled}">
        <f:if condition="{records}">
            <div class="mb-3">
                <f:translate key="widgets.searches_without_results.results" extensionName="XimaTypo3ContentAudit" arguments="{0: thresholdDays}"/>
                <f:translate key="widgets.searches_without_results.count" extensionName="XimaTypo3ContentAudit" arguments="{0: matchCount, 1: totalCount}"/>
            </div>
            <div class="widget-table-wrapper">
                <table class="widget-table {f:if(condition: '{version} >= 13', then: 'table')} table-striped table-hover">
                    <thead>
                    <tr>
                        <th><f:translate key="widgets.searches_without_results.search_word" extensionName="XimaTypo3ContentAudit"/></th>
                        <th><f:translate key="widgets.searches_without_results.search_count" extensionName="XimaTypo3ContentAudit"/></th>
                        <th><f:translate key="widgets.searches_without_results.last_searched" extensionName="XimaTypo3ContentAudit"/></th>
                    </tr>
                    </thead>
                    <tbody>
                    <f:for each="{records}" as="record">
                        <tr>
                            <td>{record.searchWord}</td>
                            <td>
                                <span class="badge badge-warning">{record.search_count}</span>
                            </td>
                            <td class="text-nowrap">
                                <f:format.date format="d.m.Y H:i">{record.last_searched}</f:format.date>
                            </td>
                        </tr>
                    </f:for>
                    </tbody>
                </table>
            </div>
        </f:if>
    </f:if>

    <f:if condition="{searchExtensionIsInstalled}">
        <f:if condition="!{records}">
            <div class="row widget-no-items-found">
                <div class="col-xs-12">
                    <p>
                        <f:translate key="widgets.searches_without_results.empty" extensionName="XimaTypo3ContentAudit"/>
                    </p>
                </div>
            </div>
        </f:if>
    </f:if>
</div>

</html>
